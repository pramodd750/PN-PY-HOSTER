services:
  - type: web
    name: pro-vps-panel
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_USER
        value: PN
      - key: OWNER_PASS
        value: "7722"
      - key: NODE_VERSION
        value: 20.11.0
